name: Build APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      # Configure your deployment with repository variables and secrets:
      #   vars:    APP_ID, BRIDGE_SCHEME, POS_URL, KDS_URL, UPDATE_MANIFEST_URL
      #   secrets: POS_AUTH_USER, POS_AUTH_PASS (optional basic auth)
      #            KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS (release signing)
      - name: Build APK
        run: gradle assembleDebug
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          APP_ID: ${{ vars.APP_ID }}
          BRIDGE_SCHEME: ${{ vars.BRIDGE_SCHEME }}
          POS_URL: ${{ vars.POS_URL }}
          KDS_URL: ${{ vars.KDS_URL }}
          UPDATE_MANIFEST_URL: ${{ vars.UPDATE_MANIFEST_URL }}
          POS_AUTH_USER: ${{ secrets.POS_AUTH_USER }}
          POS_AUTH_PASS: ${{ secrets.POS_AUTH_PASS }}

      # Sign with your own long-lived key. Square ties the app to the key's SHA-1
      # fingerprint, so a key that changes per build breaks payments.
      - name: Sign APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          BT="${ANDROID_HOME}/build-tools/$(ls "${ANDROID_HOME}/build-tools" | sort -V | tail -1)"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --out app/build/outputs/apk/debug/app-signed.apk \
            app/build/outputs/apk/debug/app-debug.apk
          keytool -printcert -jarfile app/build/outputs/apk/debug/app-signed.apk | grep -E "SHA1|SHA256"

      - uses: actions/upload-artifact@v4
        with:
          name: square-bridge-v${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
